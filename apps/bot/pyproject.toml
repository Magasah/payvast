[project]
name = "payvast-bot"
version = "0.1.0"
description = "Payvast Telegram bot (stub, no business logic yet)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiogram>=3.15,<4",
  "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001"]
